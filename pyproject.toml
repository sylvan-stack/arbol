[project]
name = "arbol"
version = "2.0.0"
description = "Arbol 2: the build tool arbol-builds and its launchers, and the shared Driver conformance runner."
requires-python = "==3.14.8"
dependencies = [
    "psycopg[binary]==3.3.6",
]

[dependency-groups]
dev = ["mypy==1.19.1", "ruff==0.14.14"]

[tool.uv]
package = false

[tool.mypy]
python_version = "3.14"
strict = true
mypy_path = ["src", "scripts"]
files = ["src/arbol_builds", "src/arbol_roots", "src/arbol_backend", "src/arbol_radar", "tests", "scripts", "bin/builds_entry.py", "bin/roots_entry.py", "bin/arbol_entry.py", "conformance", "database"]

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
